<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Combinaciones - Liga de Fantasía</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- External global style (shared palette and base rules) -->
  <link rel="stylesheet" href="CSS/combinaciones.css" />
  <link rel="stylesheet" href="CSS/btn-volver.css" />
  <link rel="stylesheet" href="CSS/style.css" />

</head>

<body>

  <!-- === HEADER / SPONSOR AREA ===
      Displays the sponsor bar at the top of the page.
      Text content is dynamically loaded from textos.json
  -->
  <div class="top-tab" id="auspiciante"></div>

  <!-- === MAIN CONTAINER ===
       Centers all content and defines the page width.
  -->
  <div class="wrap">
    <!-- === PAGE HEADER === -->
    <h1>Combinaciones</h1>

    <div class="sep"></div>

    <!-- === FILTER BAR ===
         Allows the user to filter combinations by result, team size, or player.
         Each select triggers the renderTabla() function on change.
    -->
    <div class="filters">
      <select id="filterResultado">
        <option value="">Todos los resultados</option>
        <option value="GAN">Ganadores</option>
        <option value="PER">Perdedores</option>
      </select>

      <select id="filterTamano">
        <option value="">Todos los tamaños</option>
        <option value="2">De a 2</option>
        <option value="3">De a 3</option>
        <option value="4">De a 4</option>
      </select>

      <select id="filterJugador">
        <option value="">Todos los jugadores</option>
        <!-- Filled dynamically by poblarFiltroJugadores() -->
      </select>

      <button id="btnReset">Limpiar filtros</button>
    </div>

    <div class="sep"></div>

    <!-- === COMBINATIONS TABLE ===
         Displays filtered groups of players with their total appearances together.
         Data is loaded from data/combinaciones.json
    -->
    <table id="tablaComb">
      <thead>
        <tr>
          <th>Resultado</th>
          <th>Tamaño</th>
          <th>Jugadores</th>
          <th>Veces</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- === FOOTER === 
      Simple footer bar with copyright text.
  -->
  <div class="bottom-tab">© 2025 Liga de Fulbo · PROMIEDOS</div>

  <!-- === FLOATING BACK BUTTON === -->
  <button id="btnVolver" class="btn-volver" title="Volver">←</button>

  <script src="js/combinaciones.js"></script>
  <script src="js/btn-volver.js"></script>  
  <script src="js/textos.js"></script>

</body>
</html>
