<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Intercambios</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="CSS/style.css">
<link rel="stylesheet" href="CSS/boton.css">

<style>
.hidden { display:none; }
.trading-body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.trade-page {
  display: grid;
  gap: 18px;
  width: 100%;
  flex: 1;
}
.trading-body .bottom-tab { margin-top: auto; }
.trade-title { text-align: center; margin: 0 0 8px; }
.trade-panel { padding: 18px; }
.trade-panel h3,
.trade-panel h4 { margin: 0 0 12px; }
.trade-form {
  display: grid;
  grid-template-columns: minmax(160px, 1fr) minmax(160px, 1fr) auto;
  gap: 10px;
  align-items: center;
}
.trade-page select,
.trade-page input {
  width: 100%;
  background: var(--card);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: .95rem;
  outline: none;
}
.trade-page select:focus,
.trade-page input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 8px rgba(47,139,253,.25);
}
.trade-page button,
.trade-page .btn {
  background: var(--card);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 14px;
  cursor: pointer;
  transition: border-color .2s ease, color .2s ease, background .2s ease, transform .2s ease;
}
.trade-page button:hover,
.trade-page .btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.trade-page button:active,
.trade-page .btn:active { transform: translateY(1px); }
#submitBtn,
[onclick^="acceptTrade"] {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 700;
}
#shareQueryBtn {
  background: #25d366;
  border-color: rgba(37,211,102,.45);
  color: #07130b;
  font-weight: 800;
}
#shareQueryBtn:hover {
  color: #07130b;
  border-color: #25d366;
}
.cards,
#users {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.card-list {
  display: grid;
  gap: 8px;
  margin-bottom: 14px;
}
.card-row {
  width: 100%;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 10px;
  align-items: center;
  text-align: left;
}
.card-id {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  color: var(--accent);
  font-weight: 800;
}
.card-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.trade-toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  margin-bottom: 14px;
}
.trade-toggle input {
  width: auto;
}
.cards .btn,
#users .btn { margin: 0; }
.warn { color: var(--neg); font-weight:bold; }
.ok { color: var(--pos); }
.pill {
  margin-left:6px;
  font-size:11px;
  padding:2px 7px;
  border-radius:999px;
  border: 1px solid var(--line);
}
.pill.warn {
  background: rgba(255,107,107,.12);
  border-color: rgba(255,107,107,.35);
}
.pill.ok {
  background: rgba(47,191,113,.12);
  border-color: rgba(47,191,113,.35);
}
.disabled,
.trade-page button:disabled { opacity:0.45; pointer-events:none; }
#preview,
#status,
#activeTrades { color: var(--muted); }
#preview {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(255,255,255,.02);
  padding: 12px;
  margin-bottom: 12px;
}
#status { min-height: 24px; font-weight: 700; }
.trade-box {
  border:1px solid var(--line);
  padding:14px;
  margin:10px 0 0;
  border-radius:12px;
  background: linear-gradient(180deg, #10151c, #0f141b);
  color: var(--ink);
}
.trade-section-title { margin: 0 0 8px; color: var(--ink); }
.nav-item.active { background: var(--accent); border-color: var(--accent); }
#users .btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 800;
}
.card-row.active {
  border-color: var(--accent);
  background: rgba(47,139,253,.18);
  box-shadow: 0 0 0 1px rgba(47,139,253,.25);
}
@media (max-width: 640px) {
  .trade-form { grid-template-columns: 1fr; }
  .trade-panel { padding: 14px; }
  .trade-page button,
  .trade-page .btn { min-height: 42px; }
}
</style>
</head>

<body class="trading-body">

<nav class="top-nav" id="mainNav">
  <div class="nav-scroll">
    <a href="index.html" class="nav-item">🏠</a>
    <a href="figuritas.html" class="nav-item">FIGURITAS 🃏</a>
    <a href="albums.html" class="nav-item">ALBÚM 📇</a>
    <a href="trading.html" class="nav-item active">🔀</a>
  </div>
</nav>

<div class="top-tab" id="auspiciante">INTERCAMBIOS · Liga de Fulbo</div>

<main class="wrap trade-page">
<h1 class="trade-title">Intercambios</h1>
<div class="sub">Generador de Trades</div>
<div class="sep"></div>

<section id="login" class="card trade-panel">
<h3>Ingreso</h3>
<div class="trade-form">
<select id="userSelect"></select>
<input type="password" id="password" placeholder="Clave">
<button onclick="login(this)" data-jsonbin-btn>Entrar</button>
</div>
<div id="loginError" class="warn"></div>
</section>

<div id="app" class="hidden">

<section class="card trade-panel">
<h3 id="welcome"></h3>

<div id="blockedMsg" class="warn hidden">
Ya tenés un intercambio en curso
</div>

<div id="newTradeForm" class="trade-panel">
<h4>Elegir contraparte</h4>
<div id="users"></div>

<label class="trade-toggle">
<input type="checkbox" id="onlyDupes" onchange="applyCardFilters();" checked>
Solo duplicados
</label>

<label class="trade-toggle">
<input type="checkbox" id="onlyMissing" onchange="applyCardFilters();" checked>
Solo faltantes
</label>

<h4>Mis cartas</h4>
<div id="cardsA" class="card-list"></div>
<div id="warnA" class="warn"></div>

<h4>Cartas de la contraparte</h4>
<div id="cardsB" class="card-list"></div>
<div id="warnB" class="warn"></div>

<h4>Vista previa</h4>
<div id="preview"></div>

<button id="shareQueryBtn" onclick="shareTradeQuery()">Enviar por WhatsApp</button>
<button id="submitBtn" onclick="submitTrade(this)" data-jsonbin-btn>Generar Trade</button>
</div>

<div id="status"></div>
</section>

<div class="sep"></div>
<section class="card trade-panel">
<h3 class="trade-section-title">Trades en curso</h3>
<div id="activeTrades"></div>
</section>

</div>
</main>

<script>

// ================= CONFIG =================

const BASE = {
'naicha':'z5YP','pollo':'ncoT','mario':'g8sX','ponce':'a9vR',
'benja':'k3wL','berna':'h2mQ','lomba':'f7jD','chagay':'e6rS',
'cesar':'b1uN','mato':'c4tY','juan':'l9oW'
};

const BIN_ID = "69f8b37536566621a823a468";
const API_KEY = "$2a$10$Bre/f/YRmPMXJjx0Ng62Cu0hSkWsZHgEwoh0P37DGEBK5ZcQvKfHG";
const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

// ================= STATE =================

let ALBUMS = {};
let CARDS_BY_ID = {};
let CURRENT_USER = null;
let CURRENT_TRADES = [];
let DAILY_LOCKS = {};

let SELECTED_USER_B = null;
let SELECTED_CARD_A = null;
let SELECTED_CARD_B = null;
let JSONBIN_BUSY = false;

// ================= INIT =================

(async function init(){
populateUsers();
await loadAlbums();
})();

// ================= DATA =================

async function loadAlbums(){
const [albumsRes, cardsRes] = await Promise.all([
fetch("data/albums.json"),
fetch("data/figuritas.json")
]);
ALBUMS = await albumsRes.json();
const cards = await cardsRes.json();
CARDS_BY_ID = Object.fromEntries(cards.map(card=>[card.id, card]));
}

async function loadTrades(){
try{
const res = await fetch(`${BIN_URL}/latest`, {
headers:{ "X-Access-Key": API_KEY }
});
const data = await res.json();
const record = normalizeBinRecord(data.record);
CURRENT_TRADES = record.trades;
DAILY_LOCKS = record.daily_locks;
}catch{
CURRENT_TRADES = [];
DAILY_LOCKS = {};
}
}

function normalizeBinRecord(record){
if(Array.isArray(record)){
return { trades: record, daily_locks: {} };
}

return {
trades: Array.isArray(record?.trades) ? record.trades : [],
daily_locks: record?.daily_locks || {}
};
}

function todayKey(){
const d = new Date();
const y = d.getFullYear();
const m = String(d.getMonth()+1).padStart(2,"0");
const day = String(d.getDate()).padStart(2,"0");
return `${y}-${m}-${day}`;
}

const PHONES = {
  naicha: "5493815303224",
  pollo: "5493813045879",
  mario: "5493814181046",
  ponce: "5493815457707",
  benja: "5493816225766",
  berna: "5493815423680",
  lomba: "5493815085711",
  chagay: "5493813568195",
  cesar: "5493815121839",
  mato: "5493816815324",
  juan: "5493814015021"
};

// ================= LOGIN =================

function populateUsers(){
userSelect.innerHTML = Object.keys(BASE)
.map(u=>`<option>${u}</option>`).join("");
}

async function login(btn){

if(JSONBIN_BUSY) return;

const u = userSelect.value;
const p = password.value;

if(BASE[u]===p){

CURRENT_USER = u;

setJsonbinBusy(true, btn, "Entrando...");

try{
await loadTrades();

document.getElementById("login").style.display="none";
document.getElementById("app").classList.remove("hidden");
welcome.innerText="Usuario: "+u.toUpperCase();

initApp();
}finally{
setJsonbinBusy(false);
}

}else{
loginError.innerText="Clave incorrecta";
}
}

// ================= APP =================

function initApp(){

renderActiveTrades();

if(isBlocked(CURRENT_USER)){
blockedMsg.classList.remove("hidden");
newTradeForm.classList.add("hidden");
return;
}

blockedMsg.classList.add("hidden");
newTradeForm.classList.remove("hidden");
renderUsers();
renderCardsA();
}

function isBlocked(user){
if((DAILY_LOCKS[todayKey()]||[]).includes(user)){
return true;
}

return CURRENT_TRADES.some(t =>
isOpenTrade(t) &&
(t.user_a===user || t.user_b===user)
);
}

function isOpenTrade(trade){
return trade.status==="pending" || trade.status==="accepted";
}

function renderUsers(){
users.innerHTML = Object.keys(BASE)
.filter(u=>u!==CURRENT_USER)
.filter(u=>!isBlocked(u))
.map(u=>{
const active = u===SELECTED_USER_B ? "active" : "";
return `<button class="btn ${active}" onclick="selectUser('${u}')">${u.toUpperCase()}</button>`;
}).join("");
}

function selectUser(u){
SELECTED_USER_B = u;
renderUsers();
renderCardsB();
updatePreview();
}

function applyCardFilters(){
if(SELECTED_CARD_A && !cardPassesFilters(CURRENT_USER, SELECTED_CARD_A, false)){
SELECTED_CARD_A = null;
warnA.innerText = "";
}

if(SELECTED_CARD_B && !cardPassesFilters(SELECTED_USER_B, SELECTED_CARD_B, true)){
SELECTED_CARD_B = null;
warnB.innerText = "";
}

renderCardsA();
if(SELECTED_USER_B) renderCardsB();
updatePreview();
}

// ================= CARDS =================

function renderCardsA(){
const cards = ALBUMS[CURRENT_USER]||[];
cardsA.innerHTML = renderCardList(cards, "pickA", false);
}

function renderCardsB(){
const cards = ALBUMS[SELECTED_USER_B]||[];
cardsB.innerHTML = renderCardList(cards, "pickB", true);
}

function renderCardList(cards, pickFn, isCounterpart){
const counts = count(cards);
const ids = Object.keys(counts)
.map(Number)
.filter(id=>cardPassesFilters(isCounterpart ? SELECTED_USER_B : CURRENT_USER, id, isCounterpart, counts))
.sort((a,b)=>a-b);

if(ids.length===0){
return `<div class="sub">No hay cartas para mostrar</div>`;
}

return ids.map(id=>{
const dup = counts[id]>1;
const active = pickFn==="pickA" && id===SELECTED_CARD_A || pickFn==="pickB" && id===SELECTED_CARD_B;
return `<button class="btn card-row ${active ? "active" : ""}" onclick="${pickFn}(${id})">
<span class="card-id">#${id}</span>
<span class="card-name">${cardName(id)}</span>
<span class="pill ${dup?'ok':'warn'}">${dup?`x${counts[id]}`:'Única'}</span>
</button>`;
}).join("");
}

function cardName(id){
return CARDS_BY_ID[id]?.jugador || "Carta sin nombre";
}

function isDuplicate(user, card){
return user && count(ALBUMS[user]||[])[card]>1;
}

function hasCard(user, card){
return user && (ALBUMS[user]||[]).includes(card);
}

function cardPassesFilters(user, card, isCounterpart, countsOverride){
const counts = countsOverride || count(ALBUMS[user]||[]);

if(onlyDupes.checked && counts[card]<=1){
return false;
}

if(onlyMissing.checked){
if(isCounterpart && hasCard(CURRENT_USER, card)){
return false;
}

if(!isCounterpart && SELECTED_USER_B && hasCard(SELECTED_USER_B, card)){
return false;
}
}

return true;
}

function pickA(c){
SELECTED_CARD_A = c;
warnA.innerText = count(ALBUMS[CURRENT_USER])[c]===1
? "⚠️ Es tu única copia" : "";
renderCardsA();
updatePreview();
}

function pickB(c){
SELECTED_CARD_B = c;
warnB.innerText = count(ALBUMS[SELECTED_USER_B])[c]===1
? "⚠️ No es duplicada" : "";
renderCardsB();
updatePreview();
}

function count(arr){
const c={};
arr.forEach(x=>c[x]=(c[x]||0)+1);
return c;
}

// ================= PREVIEW =================

function updatePreview(){
preview.innerText =
(CURRENT_USER && SELECTED_USER_B && SELECTED_CARD_A && SELECTED_CARD_B)
? `${CURRENT_USER.toUpperCase()} (${SELECTED_CARD_A}) <-> ${SELECTED_USER_B.toUpperCase()} (${SELECTED_CARD_B})`
: "Completar selección...";
}

function shareTradeQuery(){
if(!SELECTED_USER_B||!SELECTED_CARD_A||!SELECTED_CARD_B){
alert("Faltan datos");
return;
}

const mine = `#${SELECTED_CARD_A} (${cardName(SELECTED_CARD_A)})`;
const theirs = `#${SELECTED_CARD_B} (${cardName(SELECTED_CARD_B)})`;
const message = `Hola ${SELECTED_USER_B.toUpperCase()}, queres cambiar tu ${theirs}, por mi ${mine}?`;

const phone = PHONES[SELECTED_USER_B];
if(!phone){
alert("Número de teléfono no disponible para esta contraparte");
return;
}

window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`,"_blank");
}

// ================= TRADES =================

function renderActiveTrades(){

const trades = CURRENT_TRADES
.map((t,i)=>({...t,index:i}))
.filter(t =>
isOpenTrade(t) &&
(t.user_a===CURRENT_USER || t.user_b===CURRENT_USER)
);

if(trades.length===0){
activeTrades.innerHTML="No tenés trades activos";
return;
}

activeTrades.innerHTML = trades.map(t=>{

const isReceiver = t.user_b===CURRENT_USER;
const isPending = t.status==="pending";
const statusText = isPending ? "Pendiente" : "Confirmado";

return `
<div class="trade-box">
${t.user_a} (${t.card_a}) <-> ${t.user_b} (${t.card_b})
<br><span class="${isPending ? "warn" : "ok"}">${statusText}</span><br>

${isReceiver && isPending
? `<button onclick="acceptTrade(${t.index}, this)" data-jsonbin-btn>Confirmar intercambio</button>`
: isPending ? `Esperando confirmación` : `En el Departamente de Trading`
}

</div>
`;
}).join("");
}

// ================= SUBMIT =================

async function submitTrade(btn){

if(JSONBIN_BUSY) return;

if(!SELECTED_USER_B||!SELECTED_CARD_A||!SELECTED_CARD_B){
alert("Faltan datos");
return;
}

setJsonbinBusy(true, btn || document.getElementById("submitBtn"), "Enviando...");

const trade = {
id: window.crypto?.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`,
created_at: new Date().toISOString(),
user_a: CURRENT_USER,
user_b: SELECTED_USER_B,
card_a: SELECTED_CARD_A,
card_b: SELECTED_CARD_B,
status:"pending"
};

try{

const res = await fetch(`${BIN_URL}/latest`, {
headers:{ "X-Access-Key": API_KEY }
});
const data = await res.json();
const record = normalizeBinRecord(data.record);
const current = record.trades;

const updated = [...current, trade];
const day = todayKey();
const lockedToday = new Set(record.daily_locks[day] || []);
lockedToday.add(CURRENT_USER);
lockedToday.add(SELECTED_USER_B);
const updatedRecord = {
trades: updated,
daily_locks: {
...record.daily_locks,
[day]: [...lockedToday]
}
};

const put = await fetch(BIN_URL,{
method:"PUT",
headers:{
"Content-Type":"application/json",
"X-Access-Key": API_KEY
},
body: JSON.stringify(updatedRecord)
});

if(put.ok){
status.innerText="Trade registrado";

await loadTrades();
initApp();

}else{
status.innerText="Error al guardar";
}

}catch(e){
console.error(e);
status.innerText="Error de red";
}finally{
setJsonbinBusy(false);
}
}

// ================= ACCEPT =================

async function acceptTrade(index, btn){

if(JSONBIN_BUSY) return;

setJsonbinBusy(true, btn, "Aceptando...");

try{

const res = await fetch(`${BIN_URL}/latest`, {
headers:{ "X-Access-Key": API_KEY }
});
const data = await res.json();
const record = normalizeBinRecord(data.record);
const trades = record.trades;

trades[index].status="accepted";

await fetch(BIN_URL,{
method:"PUT",
headers:{
"Content-Type":"application/json",
"X-Access-Key": API_KEY
},
body: JSON.stringify({
...record,
trades
})
});

status.innerText="Trade aceptado";

await loadTrades();
initApp();

}catch(e){
console.error(e);
status.innerText="Error de red";
}finally{
setJsonbinBusy(false);
}
}

function setJsonbinBusy(isBusy, activeBtn, busyText){
JSONBIN_BUSY = isBusy;

document.querySelectorAll("[data-jsonbin-btn]").forEach(btn=>{
if(!btn.dataset.defaultText) btn.dataset.defaultText = btn.innerText;
btn.disabled = isBusy;
btn.classList.toggle("disabled", isBusy);
btn.innerText = isBusy && btn===activeBtn
? busyText
: btn.dataset.defaultText;
});
}

</script>
