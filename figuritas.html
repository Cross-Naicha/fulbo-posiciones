<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pack Opening Final</title>

<style>

/* BASE */

body{
margin:0;
font-family:Arial;
background:radial-gradient(circle,#1e293b,#020617);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{text-align:center;}

input{padding:10px;border-radius:6px;border:none;margin-right:10px;}

/* PACK */

.pack{
width:170px;height:230px;margin:20px auto;
display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,#facc15,#f97316);
border-radius:10px;cursor:pointer;
}

/* CARTAS */

.cards{display:flex;gap:60px;margin-top:40px;}

.card{
width:250px;height:350px;
perspective:1000px;
opacity:0;
transform:translateY(80px);
transition:transform .2s;
}

.card.show{animation:pop .8s forwards;}

@keyframes pop{
0%{transform:translateY(80px);opacity:0}
100%{transform:translateY(0);opacity:1}
}

.inner{
width:100%;height:100%;
position:relative;
transform-style:preserve-3d;
transition:transform .3s ease;
}

.card.reveal .inner{
transform:rotateY(180deg);
}

.front,.back{
position:absolute;
width:100%;height:100%;
backface-visibility:hidden;
border-radius:12px;
overflow:hidden;
}

.front{
background:#0f172a;
display:flex;align-items:center;justify-content:center;
font-size:40px;
}

.back{transform:rotateY(180deg);}

/* FRAME */

.frame{
width:100%;
height:100%;
border-radius:12px;
padding:10px;
box-sizing:border-box;
}

.frame.common{
background:linear-gradient(45deg,#f3f4f6,#9ca3af,#6b7280);
}

.frame.rare{
background:linear-gradient(45deg,#60a5fa,#1d4ed8,#93c5fd);
}

.frame.legend{
background:linear-gradient(45deg,#fde68a,#facc15,#f59e0b,#eab308);
animation:legendGlow 2s infinite alternate;
}

@keyframes legendGlow{
from{filter:brightness(1);}
to{filter:brightness(1.6);}
}

/* STICKER */

.sticker{
width:100%;
height:100%;
border-radius:8px;
overflow:hidden;
position:relative;
background:white;
isolation:isolate;
}

/* VIGNETTE */

.sticker::after{
content:"";
position:absolute;
inset:0;
background:radial-gradient(circle at center,
transparent 60%,
rgba(0,0,0,0.25));
z-index:2;
pointer-events:none;
}

/* IMAGEN */

.player{
position:absolute;
top:0;left:0;
width:100%;height:100%;
object-fit:cover;
z-index:1;
transition:transform .2s ease;
}

/* HEADER */

.header{
position:absolute;
top:10px;left:10px;right:10px;
display:flex;justify-content:space-between;
z-index:3;
}

.flag{width:28px;height:20px}

/* INFO */

.info{
position:absolute;
bottom:0;width:100%;
padding:10px;
background:linear-gradient(to top,rgba(0,0,0,.9),transparent);
z-index:3;
}

.country{text-transform:uppercase;}

/* FOIL */

.foil::before{
content:"";
position:absolute;
inset:0;
background:linear-gradient(var(--foil-angle,120deg),
transparent 47%,
rgba(255,255,255,0.5) 50%,
transparent 53%);
mix-blend-mode:screen;
z-index:2;
}

.legend .foil::before{
background:linear-gradient(
var(--foil-angle,120deg),
red,orange,yellow,green,cyan,blue,violet
);
opacity:.25;
}

/* HIGHLIGHT */

.sticker::before{
content:"";
position:absolute;
inset:0;
background:radial-gradient(circle at var(--light-x,50%) var(--light-y,50%),
rgba(255,255,255,0.25),
transparent 40%);
mix-blend-mode:screen;
z-index:2;
}

.hidden{display:none;}

</style>
</head>

<body>

<div class="container">

<h2>Abrir pack</h2>

<input id="codigo">
<button id="validar">VALIDAR</button>

<div id="pack" class="pack hidden">ABRIR</div>
<div id="cards" class="cards hidden"></div>

</div>

<script>

/* DATA */

let CARTAS=[], PACKS=[], packActual=null

const FLAGS = {
  argentina: "ar",
  estados_unidos: "us",
  mexico: "mx",
  canada: "ca",
  espana: "es",
  francia: "fr",
  inglaterra: "gb",
  brasil: "br",
  portugal: "pt",
  paises_bajos: "nl",
  alemania: "de",
  belgica: "be",

  croacia: "hr",
  marruecos: "ma",
  colombia: "co",
  uruguay: "uy",
  suiza: "ch",
  japon: "jp",
  senegal: "sn",
  iran: "ir",
  corea_sur: "kr",
  ecuador: "ec",
  austria: "at",
  australia: "au",

  noruega: "no",
  panama: "pa",
  egipto: "eg",
  argelia: "dz",
  escocia: "gb",        // 🇬🇧 UK
  paraguay: "py",
  tunez: "tn",
  costa_marfil: "ci",
  uzbekistan: "uz",
  qatar: "qa",
  arabia_saudita: "sa",
  sudafrica: "za",

  jordania: "jo",
  cabo_verde: "cv",
  ghana: "gh",
  curazao: "cw",
  haiti: "ht",
  nueva_zelanda: "nz",
  rd_congo: "cd",
  bosnia: "ba",
  chequia: "cz",
  suecia: "se",
  turquia: "tr",
  gales: "gb"           // 🇬🇧 UK
}

/* RAREZA */

function getRareza(c){
if(c.tipo==="leyenda") return "legend"
if(c.tipo==="raras") return "rare"
return "common"
}

/* ORDEN */

function ordenarPack(pack){
return pack.sort((a,b)=>{
const r={common:0,rare:1,legend:2}
return r[getRareza(a)]-r[getRareza(b)]
})
}

/* LOAD */

async function cargar(){
CARTAS=await (await fetch("data/figuritas.json")).json()
PACKS=await (await fetch("data/packs.json")).json()
}
cargar()

/* VALIDAR */

document.getElementById("validar").onclick=()=>{

const codigo=document.getElementById("codigo").value.trim()
const ids=PACKS[codigo]

if(!ids){alert("Código inválido");return}

const cont=document.getElementById("cards")
cont.innerHTML=""
cont.classList.add("hidden")

document.getElementById("pack").style.display="flex"

packActual = ordenarPack(ids.map(id=>CARTAS.find(c=>c.id===id)))
}

/* ABRIR */

document.getElementById("pack").onclick=()=>{

const cont=document.getElementById("cards")
cont.classList.remove("hidden")

document.getElementById("pack").style.display="none"

packActual.forEach((c,i)=>{

const rare=getRareza(c)
const flag=FLAGS[c.pais]||"ar"

const card=document.createElement("div")
card.className="card"

card.innerHTML=`
<div class="inner">
<div class="front">?</div>
<div class="back">
<div class="frame ${rare}">
<div class="sticker foil">

<div class="header">
<img class="flag" src="https://flagcdn.com/w40/${flag}.png">
<span>#${c.id}</span>
</div>

<img class="player" src="data/img/figuritas/${c.imagen}">

<div class="info">
<div>${c.jugador}</div>
<div class="country">${c.pais.replaceAll("_"," ")}</div>
</div>

</div>
</div>
</div>
</div>
`

cont.appendChild(card)

/* aparición */
setTimeout(()=>card.classList.add("show"),i*400)

/* reveal */
const delay = rare==="legend"?600:rare==="rare"?300:0

setTimeout(()=>{

card.classList.add("reveal")

/* WOW legend */
if(rare==="legend"){
card.style.transform="scale(1.1)"
setTimeout(()=>card.style.transform="",400)
}

spawnParticles(card, rare)

activarTilt(card)

},1200+i*600+delay)

})

}

/* PARTICULAS */

function spawnParticles(card, rare){

const colors = rare==="legend"
? ["#FFD700","#FFF3B0","#FFF"]
: ["#FFF"]

for(let i=0;i<10;i++){

const p=document.createElement("div")
p.style.position="absolute"
p.style.width="6px"
p.style.height="6px"
p.style.borderRadius="50%"
p.style.background=colors[Math.floor(Math.random()*colors.length)]
p.style.zIndex="10"

p.style.left=Math.random()*200+"px"
p.style.top=Math.random()*300+"px"

card.appendChild(p)

setTimeout(()=>{
p.style.transition="all .7s"
p.style.transform=`translate(${(Math.random()-0.5)*200}px,${(Math.random()-0.5)*200}px)`
p.style.opacity=0
},10)

setTimeout(()=>p.remove(),700)

}
}

/* TILT */

function activarTilt(card){

const inner=card.querySelector(".inner")
const img=card.querySelector(".player")
const sticker=card.querySelector(".sticker")

let x=0,y=0

card.addEventListener("mousemove",e=>{

const rect=card.getBoundingClientRect()

const mx=e.clientX-rect.left
const my=e.clientY-rect.top

const dx=(mx-rect.width/2)/12
const dy=(rect.height/2-my)/12

x+=(dy-x)*0.15
y+=(dx-y)*0.15

inner.style.transform=`rotateX(${x}deg) rotateY(${180+y}deg)`
img.style.transform=`translate(${y}px,${x}px) scale(1.05)`

sticker.style.setProperty("--foil-angle",120+y*3+"deg")
sticker.style.setProperty("--light-x",(mx/rect.width*100)+"%")
sticker.style.setProperty("--light-y",(my/rect.height*100)+"%")

})

card.addEventListener("mouseleave",()=>{
inner.style.transform="rotateY(180deg)"
img.style.transform="none"
})

}

</script>

</body>
</html>
