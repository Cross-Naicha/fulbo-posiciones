  <button class="chiqui-circle-main" id="btnFabMain">+</button>
</div>

<script>

/* ================= CONFIG ================= */

let CARTAS = [], PACKS = [], packActual = null
let bloqueado = false

const BIN_ID = "69f69157aaba88219764a5f0"
const API_KEY = "$2a$10$GOKT1tAWaguksXB1ZE0FO.x1723cMViMcGp1Ee4iG.xGq9udSGCnS"

const BASE = {
  'naicha': 'z5YP',
  'pollo': 'ncoT',
  'mario': 'g8sX',
  'ponce': 'a9vR',
  'benja': 'k3wL',
  'berna': 'h2mQ',
  'lomba': 'f7jD',
  'chagay': 'e6rS',
  'cesar': 'b1uN',
  'mato': 'c4tY',
  'juan': 'l9oW'
}

const FLAGS = {

  argentina: "ar",
  estados_unidos: "us",
  mexico: "mx",
  canada: "ca",
  espana: "es",
  francia: "fr",
  inglaterra: "gb",
  brasil: "br",
  portugal: "pt",
  paises_bajos: "nl",
  alemania: "de",
  belgica: "be",

  croacia: "hr",
  marruecos: "ma",
  colombia: "co",
  uruguay: "uy",
  suiza: "ch",
  japon: "jp",
  senegal: "sn",
  iran: "ir",
  corea_sur: "kr",
  ecuador: "ec",
  austria: "at",
  australia: "au",

  noruega: "no",

  egipto: "eg",

  escocia: "gb",

  tunez: "tn",

  qatar: "qa",

  sudafrica: "za",

  jordania: "jo",
  cabo_verde: "cv",
  ghana: "gh",
  curazao: "cw",
  haiti: "ht",
  nueva_zelanda: "nz",
  rd_congo: "cd",

  chequia: "cz",

}

/* ================= ESTADO UI ================= */

function setEstado(msg, tipo="info"){
  const el = document.getElementById("estado")
  if(!el) return
  el.style.display = "block"
  el.textContent = msg

  el.style.color =
    tipo === "error" ? "#ff4d4d" :
    tipo === "ok" ? "#4dff88" :
    "#ffffff"
}

function resetUI(){
  const btn = document.getElementById("validar")
  btn.disabled = false
  btn.textContent = "VALIDAR"
  bloqueado = false
}

/* ================= HELPERS ================= */

function getUserFromCode(code){
  return Object.keys(BASE).find(u => BASE[u] === code)
}

/* ================= JSONBIN ================= */

async function actualizarBin(usuario){

  const url = `https://api.jsonbin.io/v3/b/${BIN_ID}`

  try {

    const res = await fetch(url, {
      headers: { "X-Master-Key": API_KEY }
    })

    if(!res.ok) return false

    const data = await res.json()
    const json = data.record

    json[usuario] = 1

    const update = await fetch(url, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Master-Key": API_KEY
      },
      body: JSON.stringify(json)
    })

    return update.ok

  } catch(e){
    setEstado("Error de conexión", "error")
    return false
  }
}

/* ================= RAREZA ================= */

function getRareza(c){
  if(c.tipo==="leyenda") return "legend"
  if(c.tipo==="raras") return "rare"
  return "common"
}

function ordenarPack(pack){
  return pack.sort((a,b)=>{
    const r={common:0,rare:1,legend:2}
    return r[getRareza(a)]-r[getRareza(b)]
  })
}

/* ================= LOAD ================= */

async function cargar(){
  CARTAS = await (await fetch("data/figuritas.json")).json()
  PACKS = await (await fetch("data/packs.json")).json()
  renderStickerBackground()
}
cargar()

function renderStickerBackground(){
  const bg=document.getElementById("stickerBg")
  if(!bg) return

  bg.innerHTML=CARTAS
    .filter(c=>c.id<=80)
    .slice(0,75)
    .map(c=>`<img src="data/img/figuritas/${c.imagen}" alt="">`)
    .join("")
}

/* ================= VALIDAR ================= */

document.getElementById("validar").onclick = async () => {

  if(bloqueado) return
  bloqueado = true

  const btn = document.getElementById("validar")
  btn.disabled = true
  btn.textContent = "VALIDANDO..."

  setEstado("Verificando código...")

  const codigo = document.getElementById("codigo").value.trim()
  const ids = PACKS[codigo]

  if(!ids){
    setEstado("Código inválido", "error")
    resetUI()
    return
  }

  const usuario = getUserFromCode(codigo)
  if(!usuario){
    setEstado("Código sin usuario", "error")
    resetUI()
    return
  }

  setEstado("Validando contra servidor...")

  const ok = await actualizarBin(usuario)

  if(!ok){
    resetUI()
    return
  }

  setEstado("Código válido ✔", "ok")

  packActual = ordenarPack(ids.map(id=>CARTAS.find(c=>c.id===id)))

  const cont = document.getElementById("cards")
  cont.innerHTML = ""
  cont.classList.add("hidden")

  document.getElementById("pack").style.display = "flex"

  btn.disabled = false
  btn.textContent = "VALIDAR"
  bloqueado = false
}

/* ================= ABRIR ================= */

document.getElementById("pack").onclick = () => {

  if(!packActual) return

  const cont = document.getElementById("cards")
  cont.classList.remove("hidden")

  document.getElementById("pack").style.display = "none"

  packActual.forEach((c,i)=>{

    const rare = getRareza(c)
    const flag = FLAGS[c.pais] || "ar"

    const card = document.createElement("div")
    card.className = "card"

    card.innerHTML = `
    <div class="inner">
      <div class="front">?</div>
      <div class="back">
        <div class="frame ${rare}">
          <div class="sticker foil">

            <div class="header">
              <img class="flag" src="https://flagcdn.com/w40/${flag}.png">
              <span>#${c.id}</span>
            </div>

            <img class="player" src="data/img/figuritas/${c.imagen}">

            <div class="info">
              <div>${c.jugador}</div>
              <div class="country">${c.pais.replaceAll("_"," ")}</div>
            </div>

          </div>
        </div>
      </div>
    </div>
    <button class="share-pack-btn" onclick="shareCardWhatsapp(${c.id})">Compartir</button>
    `

    cont.appendChild(card)

    setTimeout(()=>card.classList.add("show"), i*400)

    const delay = rare==="legend"?600:rare==="rare"?300:0

    setTimeout(()=>{

      card.classList.add("reveal")

      if(rare==="legend"){
        card.style.transform="scale(1.1)"
        setTimeout(()=>card.style.transform="",400)
      }

      spawnParticles(card, rare)
      activarTilt(card)

    },1200+i*600+delay)
  })

  // reset estado
  packActual = null
}

/* ================= FX ================= */

function spawnParticles(card, rare){
  const colors = rare==="legend"
    ? ["#FFD700","#FFF3B0","#FFF"]
    : ["#FFF"]

  for(let i=0;i<10;i++){
    const p=document.createElement("div")
    p.style.position="absolute"
    p.style.width="6px"
    p.style.height="6px"
    p.style.borderRadius="50%"
    p.style.background=colors[Math.floor(Math.random()*colors.length)]
    p.style.zIndex="10"

    p.style.left=Math.random()*200+"px"
    p.style.top=Math.random()*300+"px"

    card.appendChild(p)

    setTimeout(()=>{
      p.style.transition="all .7s"
      p.style.transform=`translate(${(Math.random()-0.5)*200}px,${(Math.random()-0.5)*200}px)`
      p.style.opacity=0
    },10)

    setTimeout(()=>p.remove(),700)
  }
}

function activarTilt(card){
  const inner=card.querySelector(".inner")
  const img=card.querySelector(".player")
  const sticker=card.querySelector(".sticker")

  let x=0,y=0

  card.addEventListener("mousemove",e=>{
    if(e.target.closest(".share-pack-btn")) return

    const rect=card.getBoundingClientRect()
    const mx=e.clientX-rect.left
    const my=e.clientY-rect.top

    const dx=(mx-rect.width/2)/12
    const dy=(rect.height/2-my)/12

    x+=(dy-x)*0.15
    y+=(dx-y)*0.15

    inner.style.transform=`rotateX(${x}deg) rotateY(${180+y}deg)`
    img.style.transform=`translate(${y}px,${x}px) scale(1.05)`

    sticker.style.setProperty("--foil-angle",120+y*3+"deg")
    sticker.style.setProperty("--light-x",(mx/rect.width*100)+"%")
    sticker.style.setProperty("--light-y",(my/rect.height*100)+"%")
  })

  card.addEventListener("mouseleave",()=>{
    inner.style.transform="rotateY(180deg)"
    img.style.transform="none"
  })
}

async function shareCardWhatsapp(cardId){
  const carta=CARTAS.find(c=>c.id===cardId)
  if(!carta) return

  const canvas=await buildCardCanvas(carta)
  const blob=await canvasToBlob(canvas)
  const file=new File([blob],`figurita-${carta.id}-${slug(carta.jugador)}.png`,{type:"image/png"})
  const text=`Mirá esta figurita: #${carta.id} ${carta.jugador}`

  if(navigator.canShare?.({files:[file]}) && navigator.share){
    await navigator.share({files:[file],text,title:"Figurita Liga de Fulbo"})
    return
  }

  window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,"_blank")
}

async function buildCardCanvas(carta){
  const canvas=document.createElement("canvas")
  canvas.width=900
  canvas.height=1350
  const ctx=canvas.getContext("2d")

  drawCardFrame(ctx,carta,canvas.width,canvas.height)

  const img=await loadImage(`data/img/figuritas/${carta.imagen}`)
  drawCoverImage(ctx,img,36,36,canvas.width-72,canvas.height-72)

  const flagCode=FLAGS[carta.pais] || "ar"
  const flagImg=await loadImage(`https://flagcdn.com/w80/${flagCode}.png`)

  ctx.fillStyle="rgba(0,0,0,.72)"
  ctx.fillRect(0,canvas.height-280,canvas.width,280)
  roundRect(ctx,66,66,118,82,14)
  ctx.fill()
  roundRect(ctx,canvas.width-184,66,118,82,14)
  ctx.fill()

  ctx.drawImage(flagImg,88,86,74,42)

  ctx.fillStyle="#fff"
  ctx.font="700 44px system-ui, Arial"
  ctx.textBaseline="middle"
  ctx.textAlign="right"
  ctx.fillText(`#${carta.id}`,canvas.width-92,107)

  ctx.textAlign="left"
  ctx.textBaseline="alphabetic"
  ctx.font="800 54px system-ui, Arial"
  drawTextFit(ctx,carta.jugador,70,canvas.height-150,canvas.width-140)
  ctx.font="700 34px system-ui, Arial"
  ctx.fillStyle="rgba(255,255,255,.86)"
  drawTextFit(ctx,carta.pais.replaceAll("_"," ").toUpperCase(),70,canvas.height-92,canvas.width-140)

  return canvas
}

function loadImage(src){
  return new Promise((resolve,reject)=>{
    const img=new Image()
    img.crossOrigin="anonymous"
    img.onload=()=>resolve(img)
    img.onerror=reject
    img.src=src
  })
}

function drawCardFrame(ctx,carta,w,h){
  const gradient=ctx.createLinearGradient(0,0,w,h)
  const rare=getRareza(carta)

  if(rare==="legend"){
    gradient.addColorStop(0,"#fde68a")
    gradient.addColorStop(.5,"#facc15")
    gradient.addColorStop(1,"#f59e0b")
  }else if(rare==="rare"){
    gradient.addColorStop(0,"#60a5fa")
    gradient.addColorStop(.5,"#1d4ed8")
    gradient.addColorStop(1,"#93c5fd")
  }else{
    gradient.addColorStop(0,"#f3f4f6")
    gradient.addColorStop(.5,"#9ca3af")
    gradient.addColorStop(1,"#6b7280")
  }

  ctx.fillStyle=gradient
  ctx.fillRect(0,0,w,h)
}

function drawCoverImage(ctx,img,x,y,w,h){
  const scale=Math.max(w/img.width,h/img.height)
  const sw=w/scale
  const sh=h/scale
  const sx=(img.width-sw)/2
  const sy=(img.height-sh)/2
  ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h)
}

function drawTextFit(ctx,text,x,y,maxWidth){
  let size=parseInt(ctx.font.match(/\d+/)[0],10)
  const parts=ctx.font.split(" ")
  while(ctx.measureText(text).width>maxWidth && size>22){
    size-=2
    parts[1]=`${size}px`
    ctx.font=parts.join(" ")
  }
  ctx.fillText(text,x,y)
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath()
  ctx.moveTo(x+r,y)
  ctx.lineTo(x+w-r,y)
  ctx.quadraticCurveTo(x+w,y,x+w,y+r)
  ctx.lineTo(x+w,y+h-r)
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h)
  ctx.lineTo(x+r,y+h)
  ctx.quadraticCurveTo(x,y+h,x,y+h-r)
  ctx.lineTo(x,y+r)
  ctx.quadraticCurveTo(x,y,x+r,y)
  ctx.closePath()
}

function canvasToBlob(canvas){
  return new Promise(resolve=>canvas.toBlob(resolve,"image/png"))
}

function slug(text){
  return text
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-zA-Z0-9]+/g,"-")
    .replace(/^-|-$/g,"")
    .toLowerCase()
}

</script>
