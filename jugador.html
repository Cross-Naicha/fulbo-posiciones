<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Perfil del jugador</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- === PAGE-SPECIFIC STYLES ===
       These will be moved to css/jugador.css in the next step.
  -->
  <link rel="stylesheet" href="CSS/jugador.css">
  <link rel="stylesheet" href="CSS/style.css">

</head>

<body>

  <!-- 📌 NUEVA NAVEGACIÓN SUPERIOR FIJA -->
  <nav class="top-nav" id="mainNav">
    <div class="nav-scroll">
      <a href="index.html" class="nav-item">🏆 Posiciones</a>
      <a href="historica.html" class="nav-item">📊 Histórica</a>
      <a href="" class="nav-item active">🏃 Jugador</a>
      <a href="copas.html" class="nav-item">🥇 Copas</a>
    </div>
  </nav>
  <!-- === MAIN WRAPPER ===
       Centers all content and defines the layout width.
  -->

  <div class="top-tab" id="auspiciante"></div>
  <div class="wrap">

    <h1 id="titulo"></h1>

    <!-- === HEADER SECTION ===
         Displays back link, player name and subtitle.
    -->
    <header>
      <div>
        <h1 class="title" id="player-name">Jugador</h1>
        <p class="sub" id="subtitle">Cargando…</p>
      </div>
    </header>

    <!-- === GRID LAYOUT ===
         Contains all cards: summary, streaks, last 5, balance and partners.
    -->
    <div class="grid">

      <!-- === SUMMARY CARD === -->
      <section class="card" style="grid-column: span 12;">
        <h3>Resumen</h3>
        <div class="body" id="summary">
          <div class="status">Buscando datos del jugador…</div>
        </div>
      </section>

      <!-- === STREAKS CARD === -->
      <section class="card" style="grid-column: span 12;">
        <h3>Rachas</h3>
        <div class="body" id="streaks">
          <div class="status">Cargando rachas…</div>
        </div>
      </section>

      <!-- === LAST 5 MATCHES CARD === -->
      <section class="card" style="grid-column: span 12;">
        <h3>Últimos 5</h3>
        <div class="body" id="last5">
          <div class="status">Cargando últimos resultados…</div>
        </div>
      </section>

      <!-- === BALANCE CARD === -->
      <section class="card" style="grid-column: span 12;">
        <h3>Balance</h3>
        <div class="body" id="balance">
          <div class="status">Cargando enfrentamientos…</div>
        </div>
      </section>

      <!-- === PARTNERS CARD === -->
      <section class="card" style="grid-column: span 12;">
        <h3>Compañeros</h3>
        <div class="body" id="partners">
          <div class="status">Cargando compañeros…</div>
        </div>
      </section>

      
    </div> <!-- /grid -->
    
    
  </div> <!-- /wrap -->
  
  <div class="bottom-tab">© 2025 Liga de Fulbo · PROMIEDOS</div>
  <!-- === PAGE SCRIPT ===
       All data fetching and rendering logic will be moved to js/jugador.js.
  -->
  <script src="js/jugador.js"></script>
  <script src="js/textos.js"></script>

</body>
</html>
