<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Jugadores</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Reusá tu CSS principal si ya existe -->
  <link rel="stylesheet" href="CSS/style.css" />
  <link rel="stylesheet" href="CSS/jugadores.css" />
  <link rel="stylesheet" href="CSS/generador.css" />
  <link rel="stylesheet" href="CSS/boton.css" />

</head>

<body>

  <!-- BARRA SUPERIOR DEL AUSpICIANTE -->
  <div class="top-tab" id="auspiciante"></div>

  <!-- 📌 NAVEGACIÓN SUPERIOR FIJA (misma lógica que el resto del sitio) -->
  <nav class="top-nav" id="mainNav">
    <div class="nav-scroll">
      <a href="historica.html" class="nav-item">📈 REGISTRO</a>
      <a href="salon.html" class="nav-item">👑 FAMA</a>
      <a href="metricas.html" class="nav-item">📊 KPI</a>
      <a href="jugadores.html" class="nav-item active">🏃🏻</a>
    </div>
  </nav>

  <main class="wrap page-jugadores">

    <!-- Encabezado simple -->
    <header class="page-head">
      <h1 id="titulo" class="page-title">Jugadores</h1>
    </header>

    <div class="sep"></div>

    <!-- GRID DE TARJETAS -->
    <section class="players-grid" id="playersGrid" aria-label="Listado de jugadores">
      <!-- Las tarjetas se inyectan desde JSON -->
    </section>

    <!-- TEMPLATE DE TARJETA (Look A) -->
    <template id="playerCardTpl">
      <article class="player-card" role="article">
        <!-- Fondo -->
        <div class="player-bg" aria-hidden="true"></div>

        <!-- Estrellas (arriba derecha) -->
        <div class="player-stars" aria-label="Títulos"></div>

        <!-- Texto (abajo) -->
        <div class="player-text">
          <div class="player-name"></div>
        </div>
      </article>
    </template>

    <div class="sep"></div>
  
  <!-- Botón -->
  <div class="chiqui-floating-system" id="fabMenu">
    <div class="chiqui-menu-list">
      <button class="chiqui-circle-mini" id="btnScrollUp">▲</button>
      <a href="generador.html" class="chiqui-circle-mini">🔢</a>
      <a href="noticias.html" class="chiqui-circle-mini">📰</a>
      <a href="index.html" class="chiqui-circle-mini">📋</a>
    </div>
    <button class="chiqui-circle-main" id="btnFabMain">+</button>
  </div>

  
</main>

  <div class="bottom-tab">© 2026 Liga de Fulbo · PROMIEDOS</div>
