<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Tabla de Posiciones</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- === GLOBAL STYLES ===
       The style block below contains all color variables, layout settings,
       and visual definitions for the page.
       (In a future step, this will be moved to a separate CSS file)
  -->
  <link rel="stylesheet" href="CSS/style.css">

</head>

<body>
  <!-- === HEADER / SPONSOR AREA ===
       Displays the sponsor bar at the top of the page.
       Text content is dynamically loaded from textos.json
  -->
  <div class="top-tab" id="auspiciante"></div>

  <!-- === MAIN WRAPPER ===
       Contains all page content with a fixed maximum width for readability.
  -->
  <div class="wrap">

    <!-- === TITLE SECTION ===
         Main title, subtitle, and quote loaded dynamically from textos.json
    -->
    <h1 id="titulo"></h1>
    <h2>Tabla Historica</h2>
    <div class="sub" id="frase_chiqui"></div>

    <!-- === MAIN TABLE SECTION ===
         Shows player rankings and statistics.
         Data is fetched from data/posiciones.json
    -->
    <div class="card">
      <div id="status" class="status">Cargando datos…</div>
      <table id="tabla" style="display:none">
        <thead>
          <tr>
            <th>N°</th>
            <th>Δ</th>
            <th>X</th>
            <th>J</th>
            <th>Pts</th>
            <th>G</th>
            <th>E</th>
            <th>P</th>
            <th>G+</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <p id="novedades"></p>

    <div class="sep"></div>
    
    <!-- === NAVIGATION CARD ===
        A simple card linking to another page (combinaciones.html)
         for exploring player combinations.
    -->

    <div class="card streaks-card nav-card">
      <div class="streak-top">
        <span class="badge red">Temporada Actual</span>
        <span class="streak-len">⚽</span>
      </div>
      <div class="streak-main">
        <div class="streak-name">
          <a href="index.html" class="nav-link">
            Liga de Primavera LombardOIL 2025 →
          </a>
        </div>
      </div>
    </div>

    <!-- === NAVIGATION CARD ===
         A simple card linking to another page (combinaciones.html)
         for exploring player combinations.
    -->
    
    <p></p>

    <div class="card streaks-card nav-card">
      <div class="streak-top">
        <span class="badge blue">Combinaciones</span>
        <span class="streak-len">⚽</span>
      </div>
      <div class="streak-main">
        <div class="streak-name">
          <a href="combinaciones.html" class="nav-link">
            Explorar las diferentes combinaciones mas frecuentes →
          </a>
        </div>
      </div>
    </div>

    <p></p> <!-- Just for space  -->

    <div class="card streaks-card nav-card">
      <div class="streak-top">
        <span class="badge green">Todos los Partidos</span>
        <span class="streak-len">⚽</span>
      </div>
      <div class="streak-main">
        <div class="streak-name">
          <a href="combinaciones.html" class="nav-link">
            Historial de TODOS los partidos jugados →
          </a>
        </div>
      </div>
    </div>

  </div>

  <!-- === FOOTER ===
       Simple footer bar with copyright text.
  -->
  <div class="bottom-tab">© 2025 Liga de Fulbo · PROMIEDOS</div>

  <!-- === SCROLL TO TOP BUTTON ===
       Floating button that appears when user scrolls down.
       Controlled by the initScrollToTop() function in JS.
  -->
  <button id="toTopBtn" class="to-top" aria-label="Ir arriba" title="Ir arriba" type="button">▲</button>

  <!-- === MAIN SCRIPT ===
       Contains all interactive logic for loading texts, JSON data, overlays,
       table rendering, and matches. Will be split into modules later.
  -->
  
  <script src="js/historica.js"></script>
  <script src="js/textos.js"></script>

</body>
</html>
