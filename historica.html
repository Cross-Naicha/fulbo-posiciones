<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Tabla de Posiciones</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- === GLOBAL STYLES ===
       The style block below contains all color variables, layout settings,
       and visual definitions for the page.
       (In a future step, this will be moved to a separate CSS file)
  -->
  <link rel="stylesheet" href="CSS/style.css">
  <link rel="stylesheet" href="CSS/titulo.css">
  <link rel="stylesheet" href="CSS/boton.css">
</head>

<body>

  <!-- 📌 NUEVA NAVEGACIÓN SUPERIOR FIJA -->
  <nav class="top-nav" id="mainNav">
    <div class="nav-scroll">
      <a href="salon.html" class="nav-item">👑 FAMA</a>
      <a href="jugadores.html" class="nav-item">🏃🏻 PJS</a>
      <a href="metricas.html" class="nav-item">📊 KPI</a>
      <a href="historica.html" class="nav-item active">📈</a>
      <a href="index.html" class="nav-item">📋</a>
    </div>
  </nav>
  <!-- === HEADER / SPONSOR AREA ===
       Displays the sponsor bar at the top of the page.
       Text content is dynamically loaded from textos.json
  -->
  <div class="top-tab" id="auspiciante"></div>

  <!-- === MAIN WRAPPER ===
       Contains all page content with a fixed maximum width for readability.
  -->
  <div class="wrap">

    <!-- === TITLE SECTION ===
         Main title, subtitle, and quote loaded dynamically from textos.json
    -->
    <h1 id="titulo">Tabla Histórica</h1>
    
    <div class="sep"></div>
    <h2>Tabla Historica</h2>

    <!-- === MAIN TABLE SECTION ===
         Shows player rankings and statistics.
         Data is fetched from data/posiciones_historicas.json
    -->
    <div class="card">
      <div id="status" class="status">Cargando datos…</div>
      <table id="tabla" style="display:none">
        <thead>
          <tr>
            <th>N°</th>
            <th>JUG</th>
            <th>J</th>
            <th>Pts</th>
            <th>G</th>
            <th>E</th>
            <th>P</th>
            <th>DG</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="sep"></div>
    
    <!-- === NAVIGATION CARD ===
        A simple card linking to another page (combinaciones.html)
         for exploring player combinations.
    -->

  </div>

  <!-- === FOOTER ===
       Simple footer bar with copyright text.
  -->
  <div class="bottom-tab">© 2026 Liga de Fulbo · PROMIEDOS</div>

  <!-- === SCROLL TO TOP BUTTON ===
       Floating button that appears when user scrolls down.
       Controlled by the initScrollToTop() function in JS.
  -->
    <!-- Botón -->
  <div class="chiqui-floating-system" id="fabMenu">
    <div class="chiqui-menu-list">
      <button class="chiqui-circle-mini" id="btnScrollUp">▲</button>
      <a href="generador.html" class="chiqui-circle-mini">🔢</a>
      <a href="noticias.html" class="chiqui-circle-mini">📰</a>
    </div>
    <button class="chiqui-circle-main" id="btnFabMain">+</button>
  </div>

  <!-- === MAIN SCRIPT ===
       Contains all interactive logic for loading texts, JSON data, overlays,
       table rendering, and matches. Will be split into modules later.
  -->
  
  <script src="js/historica.js"></script>
  <script src="js/textos.js"></script>
  <script src="js/boton.js"></script>

</body>
</html>
