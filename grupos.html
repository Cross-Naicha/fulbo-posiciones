<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Grupos · Chiqui Liga</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="CSS/style.css">
  <link rel="stylesheet" href="CSS/titulo.css">
  <link rel="stylesheet" href="CSS/boton.css">
  <style>
    .groups-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin-top: 20px;
    }
    .group-container {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 15px;
        overflow: hidden;
    }
    .group-title {
        color: var(--accent);
        font-size: 1rem;
        margin-bottom: 12px;
        text-transform: uppercase;
        border-bottom: 1px solid var(--line);
        padding-bottom: 5px;
        display: flex;
        justify-content: space-between;
    }
    table.group-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
    }
    .group-table th { color: var(--muted); font-weight: normal; padding: 8px 5px; text-align: center; }
    .group-table td { padding: 10px 5px; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; }
    .group-table .txt-left { text-align: left; }
    
    .team-cell { display: flex; align-items: center; gap: 8px; }
    .team-cell img { width: 20px; border-radius: 2px; }
    .team-cell b { color: var(--ink); font-size: 0.9rem; }
    .team-cell span { color: var(--muted); font-size: 0.75rem; }

    .pts-bold { font-weight: 900; color: var(--pos); }
    
    /* Colores para clasificados */
    .row-q { border-left: 3px solid var(--pos); }
  </style>
</head>
<body>
  <!-- 📌 NAV SUPERIOR -->
  <nav class="top-nav" id="mainNav">
    <div class="nav-scroll">
      <a href="mundial.html" class="nav-item">🌎 MUNDIAL</a>
      <a href="partidos_mundial.html" class="nav-item">⚽ PARTIDOS</a>
      <a href="grupos.html" class="nav-item active">🫂</a>
    </div>
  </nav>

    <!-- BARRA SUPERIOR DEL AUSPICIANTE -->
  <div class="top-tab" id="auspiciante"></div>

  <div class="wrap">
    <h1 id="titulo">Grupos del Mundial FIFA 2026</h1>
    <p style="font-size: 0.8rem; color: var(--muted);">Cálculo automático basado en resultados oficiales.</p>
    
    <div id="groupsWrapper" class="groups-grid">
        </div>
  </div>

    <!-- Botón -->
  <div class="chiqui-floating-system" id="fabMenu">
    <div class="chiqui-menu-list">
      <button class="chiqui-circle-mini" id="btnScrollUp">▲</button>
      <a href="generador.html" class="chiqui-circle-mini">🔢</a>
      <a href="noticias.html" class="chiqui-circle-mini">📰</a>
      <a href="index.html" class="chiqui-circle-mini">📋</a>
    </div>
    <button class="chiqui-circle-main" id="btnFabMain">+</button>
  </div>

  <div class="bottom-tab">© 2026 Liga de Fulbo · PROMIEDOS</div>

  <script src="js/grupos.js"></script>
  <script src="js/textos.js"></script>
  <script src="js/boton.js"></script>
</body>
</html>
