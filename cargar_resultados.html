<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - LDF</title>
  
  <style>
    /* =========================================================
       ESTILOS INTEGRADOS (No necesitas archivos externos)
       ========================================================= */
    :root {
      --bg: #0b0d10;
      --card: #11161c;
      --ink: #e8eef6;
      --muted: #9fb0c3;
      --line: #223042;
      --accent: #2f8bfd;
      --pos: #2fbf71;
      --neg: #bf2f52;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .wrap { 
      max-width: 600px; 
      margin: 40px auto; 
      padding: 16px; 
      flex: 1; 
      width: 100%;
    }

    header { text-align: center; margin-bottom: 24px; }
    
    h1 {
      font-size: 2rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -1px;
      background: linear-gradient(to bottom, #fff, var(--muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }

    .admin-panel {
      background: var(--card);
      border-radius: 14px;
      padding: 20px;
      border: 1px solid var(--line);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }

    h3 { 
      font-size: 0.8rem; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
      color: var(--accent); 
      margin-bottom: 15px;
      text-align: center;
    }

    /* Marcador */
    .marcador-admin { display: flex; gap: 8px; margin-bottom: 20px; }
    .btn-resultado {
      flex: 1; background: rgba(255,255,255,0.03); border: 1px solid var(--line);
      color: var(--muted); border-radius: 10px; padding: 14px 5px; font-weight: 700;
      cursor: pointer; transition: 0.2s;
    }
    .btn-resultado.active[data-tipo="A"] { background: var(--accent); color: white; border-color: var(--accent); }
    .btn-resultado.active[data-tipo="B"] { background: var(--neg); color: white; border-color: var(--neg); }
    .btn-resultado.active[data-tipo="E"] { background: var(--line); color: var(--ink); border-color: var(--muted); }

    .balance-wrapper { text-align: center; padding: 10px; }
    #inputBalance {
      background: transparent; border: none; border-bottom: 2px solid var(--line);
      color: white; font-size: 2.5rem; font-weight: 800; width: 100px;
      text-align: center; outline: none;
    }

    /* Formaciones */
    .equipos-grid-admin { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .slot-item {
      background: rgba(255,255,255,0.02); border: 1px dashed var(--line);
      border-radius: 8px; padding: 10px; margin-bottom: 6px; text-align: center;
      font-size: 0.85rem; min-height: 40px; display: flex; align-items: center; justify-content: center;
    }
    .slot-item.occupied { background: rgba(255,255,255,0.05); border: 1px solid var(--line); font-weight: 600; }

    /* Padrón */
    .jugadores-lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
    .jugador-card-admin {
      background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 8px;
      padding: 10px; text-align: center; font-size: 0.8rem; cursor: pointer; transition: 0.2s;
    }
    .jugador-card-admin.in-a { border-color: var(--accent); background: rgba(47,139,253,0.15); color: #fff; }
    .jugador-card-admin.in-b { border-color: var(--neg); background: rgba(191,47,82,0.15); color: #fff; }

    /* PIN */
    .pin-modal { text-align: center; padding: 40px 20px; }
    #pinInput {
      background: transparent; border: none; border-bottom: 3px solid var(--line);
      color: white; font-size: 3rem; width: 100%; max-width: 200px;
      text-align: center; letter-spacing: 10px; outline: none;
    }

    .btn-subir {
      background: linear-gradient(135deg, var(--pos), #1db05f);
      color: #fff; border: none; border-radius: 12px; padding: 18px;
      font-weight: 800; text-transform: uppercase; width: 100%; cursor: pointer;
      margin-top: 20px; box-shadow: 0 4px 15px rgba(46, 191, 113, 0.2);
    }

    .bottom-tab {
      width: 100%; height: 60px; background: var(--card); border-top: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted);
    }

    .btn-volver {
  display: inline-block;
  margin-top: 10px;
  color: var(--muted);
  text-decoration: none;
  font-size: 0.8rem;
  font-weight: 700;
  padding: 8px 16px;
  border: 1px solid var(--line);
  border-radius: 8px;
  transition: 0.3s;
}

.btn-volver:hover {
  background: var(--line);
  color: var(--accent);
  border-color: var(--accent);
}
  </style>
</head>

<body>

  <div class="wrap">
    
    <section id="pin-screen">
      <header><h1>ACCESO</h1></header>
      <div class="admin-panel pin-modal">
        <h3>PIN DE SEGURIDAD</h3>
        <input type="password" id="pinInput" maxlength="4" inputmode="numeric" autofocus>
        <p id="pinError" style="color:var(--neg); display:none; margin-top:15px; font-size: 0.8rem;">PIN INCORRECTO</p>
      </div>
    </section>

    <section id="main-admin" style="display:none;">
      <header>
        <h1>RESULTADO</h1>
        <a href="index.html" class="btn-volver">← VOLVER</a>
      </header>

      <div class="admin-panel">
        <h3>MARCADOR</h3>
        <div class="marcador-admin">
          <button class="btn-resultado" data-tipo="A" onclick="setWinner('A')">EQUIPO A</button>
          <button class="btn-resultado" data-tipo="E" onclick="setWinner('E')">EMPATE</button>
          <button class="btn-resultado" data-tipo="B" onclick="setWinner('B')">EQUIPO B</button>
        </div>
        <div class="balance-wrapper">
          <label style="display:block; font-size: 0.7rem; color:var(--muted); margin-bottom: 5px;">BALANCE DE GOLES</label>
          <input type="number" id="inputBalance" inputmode="numeric" placeholder="0">
        </div>
      </div>

      <div class="admin-panel">
        <h3>EQUIPOS (5 vs 5)</h3>
        <div class="equipos-grid-admin">
          <div id="col-a"></div>
          <div id="col-b"></div>
        </div>
      </div>

      <div class="admin-panel">
        <h3>LISTA DE JUGADORES</h3>
        <div id="padrón-list" class="jugadores-lista"></div>
      </div>

      <button class="btn-subir" id="btnFinalizar" onclick="enviarDatos()">🚀 FINALIZAR Y SUBIR</button>
    </section>

  </div>

  <div class="bottom-tab">© 2026 Liga de Fulbo · ADMIN PANEL</div>

  <script>
    // =========================================================
    // CONFIGURACIÓN (REMPLAZAR ESTO)
    // =========================================================
    const PIN_KEY = "2828"; 
    const BIN_ID = "697f6a46d0ea881f4098d72d";
    const API_KEY = "$2a$10$XSHsjUg2t1GhKtm6WHHExubP4vMFhnUhzuTdoHe4BQvGCSVPIGQwi";

    let REGULARES = [];
    let eqA = [];
    let eqB = [];
    let winner = null;

    // 1. Leer archivo local de jugadores
    async function cargarJugadores() {
      try {
        const res = await fetch('data/lista_jugadores.json');
        const data = await res.json();
        REGULARES = data.map(j => j[1]); // Toma el nombre (posición 1)
      } catch (e) {
        console.error("Error cargando JSON", e);
      }
    }

    // 2. Control del PIN
    document.getElementById('pinInput').addEventListener('input', async (e) => {
      if (e.target.value === PIN_KEY) {
        await cargarJugadores();
        document.getElementById('pin-screen').style.display = 'none';
        document.getElementById('main-admin').style.display = 'block';
        initAdmin();
      } else if (e.target.value.length === 4) {
        document.getElementById('pinError').style.display = 'block';
        e.target.value = '';
      }
    });

    function initAdmin() {
      renderPadrón();
      updateSlots();
    }

function togglePlayer(name) {
      // 1. Si el jugador NO está en ningún equipo
      if (!eqA.includes(name) && !eqB.includes(name)) {
        if (eqA.length < 5) {
          eqA.push(name); // Va a A si hay lugar
        } else if (eqB.length < 5) {
          eqB.push(name); // SI A ESTÁ LLENO, VA DIRECTO A B (Aquí está la corrección)
        }
      } 
      // 2. Si ya está en A, lo pasamos a B
      else if (eqA.includes(name)) {
        eqA = eqA.filter(n => n !== name);
        if (eqB.length < 5) {
          eqB.push(name);
        }
      } 
      // 3. Si ya está en B, lo sacamos
      else {
        eqB = eqB.filter(n => n !== name);
      }
      
      renderPadrón();
      updateSlots();
    }
  
    function renderPadrón() {
      const list = document.getElementById('padrón-list');
      list.innerHTML = '';
      REGULARES.forEach(name => {
        const div = document.createElement('div');
        div.className = 'jugador-card-admin';
        if (eqA.includes(name)) div.classList.add('in-a');
        if (eqB.includes(name)) div.classList.add('in-b');
        div.innerText = name;
        div.onclick = () => togglePlayer(name);
        list.appendChild(div);
      });
    }

    function updateSlots() {
      const colA = document.getElementById('col-a');
      const colB = document.getElementById('col-b');
      colA.innerHTML = ''; colB.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        colA.innerHTML += `<div class="slot-item ${eqA[i] ? 'occupied' : ''}">${eqA[i] || 'BOT'}</div>`;
        colB.innerHTML += `<div class="slot-item ${eqB[i] ? 'occupied' : ''}">${eqB[i] || 'BOT'}</div>`;
      }
    }

    // 4. Resultado y Envío
    function setWinner(type) {
      winner = type;
      document.querySelectorAll('.btn-resultado').forEach(b => b.classList.remove('active'));
      document.querySelector(`[data-tipo="${type}"]`).classList.add('active');
      const bInput = document.getElementById('inputBalance');
      if(type === 'E') { bInput.value = 0; bInput.disabled = true; }
      else { bInput.disabled = false; bInput.focus(); }
    }

    async function enviarDatos() {
      if (!winner) return alert("Seleccioná el ganador");
      const btn = document.getElementById('btnFinalizar');
      
      // Guardamos el texto original por si hay que resetearlo
      const originalText = btn.innerText;
      btn.innerText = "SUBIENDO..."; 
      btn.disabled = true;

      const payload = {
        fecha: new Date().toISOString().split('T')[0],
        resultado: { 
          ganador: winner, 
          balance: parseInt(document.getElementById('inputBalance').value) || 0 
        },
        equipo_a: [...eqA, ...Array(5 - eqA.length).fill("BOT")],
        equipo_b: [...eqB, ...Array(5 - eqB.length).fill("BOT")]
      };

      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: 'PUT',
          headers: { 
            'Content-Type': 'application/json', 
            'X-Access-Key': API_KEY // <--- CAMBIADO A X-Access-Key
          },
          body: JSON.stringify(payload)
        });

        const resData = await res.json();

        if (res.ok) { 
          alert("✅ ¡Éxito! Datos guardados en la nube."); 
          location.reload(); 
        } else {
          // Si JSONbin responde pero con un error (ej: PIN o ID mal)
          console.error("Detalle del error:", resData);
          alert("Error de JSONbin: " + (resData.message || "Credenciales incorrectas"));
          btn.disabled = false; 
          btn.innerText = originalText;
        }
      } catch (e) {
        // Si hay un error de red o de código
        console.error("Error de conexión:", e);
        alert("Error de red: No se pudo alcanzar el servidor.");
        btn.disabled = false; 
        btn.innerText = originalText;
      }
    }

  </script>
</body>
</html>
