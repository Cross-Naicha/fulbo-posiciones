<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Álbum · Liga de Fulbo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="CSS/style.css">

<style>

/* ================= LOGIN ================= */
.login-box{
  max-width:320px;
  margin:120px auto;
  text-align:center;
}

.login-box select,
.login-box input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
  border:1px solid #333;
  background:#111;
  color:white;
}

/* ================= HEADER ================= */
.album-header{
  text-align:center;
  margin-top:90px;
}

.logout{
  position:fixed;
  top:10px;
  right:10px;
  padding:6px 10px;
  border:none;
  border-radius:8px;
  background:#ff4444;
  color:white;
  cursor:pointer;
}

/* ================= STATS ================= */
.stats{
  text-align:center;
  margin-top:10px;
  color:#ccc;
}

/* ================= FILTROS ================= */
.filter-bar{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-top:20px;
  flex-wrap:wrap;
}

.filter-bar button{
  padding:6px 12px;
  border-radius:999px;
  border:1px solid #333;
  background:#111;
  color:white;
  cursor:pointer;
  transition:.2s;
}

.filter-bar button.active{
  background:#2f8bfd;
}

/* ================= COMPARADOR ================= */
.compare-box{
  display:flex;
  justify-content:center;
  margin-top:10px;
}

/* ================= GRID ================= */
.album{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
  gap:10px;
  padding:20px;
  transition:.3s;
}

.album.filtered{
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
}

/* ================= SLOT ================= */
.slot{
  aspect-ratio:2/3;
  border-radius:10px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;

  transform:scale(.95);
  opacity:0;
  animation:fadeIn .4s forwards;
}

@keyframes fadeIn{
  to{ transform:scale(1); opacity:1 }
}

.empty{
  background:#111;
  border:1px dashed #333;
  color:#777;
}

.filled{
  background:#000;
  border:1px solid #222;
}

.slot img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.rare{ box-shadow:0 0 8px #3b82f6; }
.legend{ box-shadow:0 0 14px gold; }

.count{
  position:absolute;
  bottom:2px;
  right:4px;
  font-size:10px;
  background:rgba(0,0,0,.7);
  padding:2px 5px;
  border-radius:6px;
}

/* ================= RANKING ================= */
.ranking{
  max-width:500px;
  margin:30px auto;
  background:#111;
  border-radius:12px;
  padding:10px;
}

.rank-item{
  display:flex;
  justify-content:space-between;
  padding:10px;
  border-bottom:1px solid #222;
  font-size:14px;
}

.rank-item:first-child{
  font-weight:700;
  color:gold;
}

.rank-item.me{
  background:#2f8bfd22;
}

/* ================= MODAL ================= */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:3000;
}

.hidden{ display:none; }

.modal-content{
  width:260px;
  height:360px;
  animation:pop .3s ease;
}

@keyframes pop{
  from{ transform:scale(.8); opacity:0 }
  to{ transform:scale(1); opacity:1 }
}

.modal-frame{
  width:100%;
  height:100%;
  border-radius:12px;
  padding:10px;
}

.modal-frame.common{
  background:linear-gradient(45deg,#f3f4f6,#9ca3af,#6b7280);
}

.modal-frame.rare{
  background:linear-gradient(45deg,#60a5fa,#1d4ed8,#93c5fd);
}

.modal-frame.legend{
  background:linear-gradient(45deg,#fde68a,#facc15,#f59e0b);
  box-shadow:0 0 20px gold;
}

.modal-sticker{
  width:100%;
  height:100%;
  border-radius:8px;
  overflow:hidden;
  position:relative;
}

.modal-img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.modal-header{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  display:flex;
  justify-content:space-between;
}

.modal-info{
  position:absolute;
  bottom:0;
  width:100%;
  padding:10px;
  background:linear-gradient(to top,rgba(0,0,0,.9),transparent);
}

.modal-info div:last-child{
  text-transform:uppercase;
}

</style>

<link rel="stylesheet" href="CSS/boton.css">

</head>

<body>

<nav class="top-nav" id="mainNav">
<div class="nav-scroll">
  <a href="index.html" class="nav-item">🏠 HOME</a>
  <a href="figuritas.html" class="nav-item">🃏 FIGURITAS</a>
  <a href="albums.html" class="active nav-item">📚</a>
</div>
</nav>

<div class="top-tab" id="auspiciante"></div>

<!-- LOGIN -->
<div id="login" class="login-box">
  <h2>Álbum</h2>
  <select id="user"></select>
  <input id="code" placeholder="Código">
  <button onclick="login()">VALIDAR</button>
</div>

<!-- APP -->
<div id="app" style="display:none">

  <button class="logout" onclick="logout()">Salir</button>

  <div class="album-header">
    <h2 id="title"></h2>
    <p id="progress"></p>
  </div>

  <div class="stats" id="stats"></div>

  <div class="filter-bar" id="filters"></div>

  <div id="ranking" class="ranking" style="display:none"></div>

  <div id="album" class="album"></div>

</div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
  <div id="modalContent" class="modal-content"></div>
</div>

  </div> <footer class="bottom-tab">
    <a href="cargar_resultados.html" class="enlace-secreto">©</a> 2026 Liga de Fulbo · PROMIEDOS
  </footer>

  <div class="chiqui-floating-system" id="fabMenu">
    <div class="chiqui-menu-list">
      <button class="chiqui-circle-mini" id="btnScrollUp">▲</button>
      <a href="generador.html" class="chiqui-circle-mini">🔢</a>
      <a href="noticias.html" class="chiqui-circle-mini">📰</a>
    </div>
    <button class="chiqui-circle-main" id="btnFabMain">+</button>
  </div>

<script>

/* USERS */
const USERS = {
  naicha:'z5YP',
  pollo:'ncoT',
  mario:'g8sX',
  ponce:'a9vR',
  benja:'k3wL',
  berna:'h2mQ',
  lomba:'f7jD',
  chagay:'e6rS',
  cesar: 'b1uN',
  mato: 'c4tY',
  chicho: 'd0xV',
  juan: 'l9oW',
  marcos: 'i5pB'
}

let CARTAS=[], ALBUMS=[]
let currentFilter="all"
let viewMode="album"
let userSet, globalCount, currentUser

/* INIT SELECT */
Object.keys(USERS).forEach(u=>{
  const opt=document.createElement("option")
  opt.value=u
  opt.innerText=u
  document.getElementById("user").appendChild(opt)
})

async function load(){
  CARTAS = await (await fetch("data/figuritas.json")).json()
  ALBUMS = await (await fetch("data/albums.json")).json()
}

function login(){
  const user=document.getElementById("user").value
  const code=document.getElementById("code").value.trim()

  if(!USERS[user]||USERS[user]!==code){
    alert("Código incorrecto");return
  }

  localStorage.setItem("user",user)
  start(user)
}

function logout(){
  localStorage.removeItem("user")
  location.reload()
}

async function start(user){

  currentUser=user

  await load()

  document.getElementById("login").style.display="none"
  document.getElementById("app").style.display="block"

  userSet=new Set(ALBUMS[user]||[])

  globalCount={}
  Object.values(ALBUMS).forEach(arr=>{
    new Set(arr).forEach(id=>{
      globalCount[id]=(globalCount[id]||0)+1
    })
  })

  document.getElementById("title").innerText="Álbum de "+user.toUpperCase()

  updateStats()
  createFilters()
  createRanking()

  renderAlbum()
}

function updateStats(){
  const total=CARTAS.length
  const owned=userSet.size
  const percent=Math.round((owned/total)*100)

  document.getElementById("progress").innerText=
    `${owned} / ${total} (${percent}%)`
}

/* RANKING */
function createRanking(){

  const rankingDiv=document.getElementById("ranking")
  rankingDiv.innerHTML=""

  const ranking=Object.entries(ALBUMS)
    .map(([u,arr])=>[u,new Set(arr).size])
    .sort((a,b)=>b[1]-a[1])

  ranking.forEach(([u,count])=>{
    const div=document.createElement("div")
    div.className="rank-item "+(u===currentUser?"me":"")
    div.innerHTML=`<span>${u}</span><span>${count}</span>`
    rankingDiv.appendChild(div)
  })
}

/* FILTROS + MODOS */
function createFilters(){

  const div=document.getElementById("filters")
  div.innerHTML=""

  /* ÁLBUM */
  const albumBtn=document.createElement("button")
  albumBtn.innerText="ÁLBUM"
  albumBtn.classList.add("active")

  albumBtn.onclick=()=>{
    viewMode="album"

    /* 👇 CLAVE */
    currentFilter="all"

    resetButtons(albumBtn)

    document.getElementById("ranking").style.display="none"
    document.getElementById("album").style.display="grid"

    renderAlbum()
  }

  div.appendChild(albumBtn)

  /* TIPOS */
  const tipos=[...new Set(CARTAS.map(c=>c.tipo))]
  tipos.forEach(tipo=>{
    const btn=document.createElement("button")
    btn.innerText=tipo.toUpperCase()

    btn.onclick=()=>{
      viewMode="album"
      currentFilter=tipo
      resetButtons(btn)
      document.getElementById("ranking").style.display="none"
      document.getElementById("album").style.display="grid"
      renderAlbum()
    }

    div.appendChild(btn)
  })

  /* RANKING */
  const rankBtn=document.createElement("button")
  rankBtn.innerText="🏆 RANKING"

  rankBtn.onclick=()=>{
    viewMode="ranking"
    resetButtons(rankBtn)
    document.getElementById("album").style.display="none"
    document.getElementById("ranking").style.display="block"
  }

  div.appendChild(rankBtn)
}

function resetButtons(activeBtn){
  document.querySelectorAll(".filter-bar button")
    .forEach(b=>b.classList.remove("active"))
  activeBtn.classList.add("active")
}

/* RENDER */
function renderAlbum(compareSet=null){

  if(viewMode==="ranking") return

  const container=document.getElementById("album")
  container.innerHTML=""
  container.classList.toggle("filtered",currentFilter!=="all")

  CARTAS.forEach((carta,i)=>{

    if(currentFilter!=="all" && carta.tipo!==currentFilter) return

    const has=userSet.has(carta.id)
    const other=compareSet?.has(carta.id)

    const div=document.createElement("div")
    div.className="slot "+(has?"filled":"empty")
    div.style.animationDelay=(i*0.01)+"s"

    if(has){
      div.innerHTML=`
        <img src="data/img/figuritas/${carta.imagen}">
        <div class="count">👥 ${globalCount[carta.id]||0}</div>
      `

      if(carta.tipo==="raras") div.classList.add("rare")
      if(carta.tipo==="leyenda") div.classList.add("legend")

      if(compareSet && !other){
        div.style.opacity=".3"
      }

      div.onclick=()=>openCard(carta)
    }else{
      div.innerText="#"+carta.id
    }

    container.appendChild(div)
  })
}

/* MODAL */
function openCard(carta){

  const rare=
    carta.tipo==="leyenda"?"legend":
    carta.tipo==="raras"?"rare":"common"

  document.getElementById("modalContent").innerHTML=`
    <div class="modal-frame ${rare}">
      <div class="modal-sticker">
        <div class="modal-header">
          <span>#${carta.id}</span>
          <span>👥 ${globalCount[carta.id]||0}</span>
        </div>
        <img class="modal-img" src="data/img/figuritas/${carta.imagen}">
        <div class="modal-info">
          <div>${carta.jugador}</div>
          <div>${carta.pais.replaceAll("_"," ")}</div>
        </div>
      </div>
    </div>
  `

  document.getElementById("modal").classList.remove("hidden")
}

document.getElementById("modal").onclick=e=>{
  if(e.target.id==="modal"){
    e.currentTarget.classList.add("hidden")
  }
}

/* AUTO LOGIN */
const saved=localStorage.getItem("user")
if(saved) start(saved)

</script>
<script src="js/textos.js"></script>
<script src="js/boton.js"></script>

</body>
</html>
